<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="style.css" />
    <title>repl.it</title>
  </head>
  <body>
    <div>
      <div id="ex1" class="ex">
        <h5>Ex1 - OnClick</h5>
        <button id="ex1_button">Click me</button>
        <div id="ex1_content">
          <img
            src="https://preview.redd.it/mnore-picss-of-sssdfg-cat-v0-vko685lpymkg1.jpeg?auto=webp&s=09fe28da405e5fafdb7a9126b02bd110d9b7ad05"
          />
        </div>
      </div>

      <div id="ex2" class="ex">
        <h5>Ex2 - Validation</h5>
        <input type="text" id="ex2_text" placeholder="phone number" />
        <div id="ex2_count"></div>
        <div id="ex2_content"></div>
      </div>

      <div id="ex3" class="ex">
        <h5>Ex3 - Drag&Drop</h5>
        <div>
          <div id="ex3_one">
            <div id="ex3_element">Content</div>
          </div>
          <div id="ex3_two"></div>
        </div>
      </div>

      <div id="ex4" class="ex">
        <h5>Ex4 - Background</h5>
        <button id="ex4_button">Random background color</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
